plugins {
    id 'java'
    id 'application'
    id "com.github.johnrengelman.shadow" version '8.1.1'
}

application {
    mainClass = 'main.RoleBot'
}
version '2.4'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['res']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name 'm2-dv8tion'
        url 'https://m2.dv8tion.net/releases'
    }
    jcenter()
}

dependencies {
    implementation 'net.dv8tion:JDA:5.0.2'
    implementation 'org.mariadb.jdbc:mariadb-java-client:2.7.0'
    implementation 'com.zaxxer:HikariCP:4.0.3'
    implementation 'com.google.guava:guava:30.0-jre'
    implementation 'org.slf4j:slf4j-log4j12:1.7.30'
    implementation 'com.opencsv:opencsv:5.3'
    implementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

tasks.named('test') {
    systemProperty 'bot.offline', 'true'
    ['db.url', 'db.user', 'db.pass', 'live.net'].each { k ->
        if (System.getProperty(k)) systemProperty k, System.getProperty(k)
    }
}

tasks.register('exportArt', JavaExec) {
    description = 'Writes the mascot variants to art-out/ for upload as server emoji'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'command.util.art.ArtExport'
}
